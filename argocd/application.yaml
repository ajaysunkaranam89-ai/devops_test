apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-practice-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ajaysunkaranam89-ai/devops_test.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: practice
  syncPolicy:
    automated:
      prune: true     # delete resources removed from git
      selfHeal: true  # undo manual kubectl changes
    syncOptions:
      - CreateNamespace=true
